<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UI tests</title>
<!-- Screen tests. They drive the real admin and student pages inside a phone-sized frame.
     Run: serve the mockups folder with any static server, open /tests/ui-tests.html, wait for "UI TESTS: ... passed".
     It clears this site's saved data in the browser first, so use a private window or a spare browser profile. -->
<style>
  body { font: 14px/1.4 system-ui, sans-serif; margin: 12px; display: flex; gap: 16px; align-items: flex-start; }
  #out { flex: 1; min-width: 320px; } #out div { padding: 2px 0; } .ok { color: #1f7a4d; } .bad { color: #b73428; font-weight: 700; }
  #frames iframe { border: 1px solid #bbb; border-radius: 8px; }
</style>
</head>
<body>
<div id="out"><b id="sum">running...</b></div>
<div id="frames"></div>
<script src="../mock-core.js"></script>
<script src="../store.js"></script>
<script>
(function () {
  var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  var tests = [], res = { passed: 0, failed: 0, results: [] };
  function test(name, fn) { tests.push([name, fn]); }
  function ok(c, msg) { if (!c) throw new Error(msg || 'assertion failed'); }
  function eq(a, b, msg) { if (JSON.stringify(a) !== JSON.stringify(b)) throw new Error((msg || 'not equal') + ': ' + JSON.stringify(a) + ' vs ' + JSON.stringify(b)); }
  var q = function (w, s) { return w.document.querySelector(s); }, qa = function (w, s) { return [].slice.call(w.document.querySelectorAll(s)); };
  var txt = function (w, s) { var e = q(w, s); return e ? e.innerText.replace(/\s+/g, ' ').trim() : ''; };
  async function click(w, s) { var e = typeof s === 'string' ? q(w, s) : s; if (!e) throw new Error('missing ' + s); if (e.disabled) throw new Error('disabled ' + s); e.click(); await sleep(140); }
  async function type(w, s, v, ev) { var e = q(w, s); e.value = v; e.dispatchEvent(new Event(ev || 'input', { bubbles: true })); await sleep(90); }
  async function frame(url) {
    var f = document.createElement('iframe'); f.style.cssText = 'width:375px;height:760px';
    document.getElementById('frames').replaceChildren(f); f.src = url;
    await new Promise(function (r) { f.onload = r; });
    for (var i = 0; i < 60 && !f.contentWindow.document.querySelector('.hdr, .start, .top, .wzv, [style*="padding:60px"]'); i++) await sleep(100);   // wait until the page has drawn
    if (url.indexOf('#c=') >= 0) for (i = 0; i < 40 && !localStorage.getItem('bc_card'); i++) await sleep(100);   // the page remembers the card once it has been read
    await sleep(250); return f.contentWindow;
  }
  function wipe() { try { localStorage.clear(); } catch (e) { /* ignore */ } }
  /* a saved class in the browser, so the admin page opens straight into it */
  function saveClass(build) {
    BC.blank(); BC.today = '2026-11-05'; var out = build() || {}; BC.meta = { sample: false, setup: true };
    BC.autosave(); BC.markBackedUp(); return out;
  }
  function two() { var a = BC.addStudent({ name: 'John', type: 'fixed', days: [2, 4], start: '2026-09-01' }), b = BC.addStudent({ name: 'Jane', type: 'fixed', days: [2], start: '2026-09-01' }); [a, b].forEach(function (s) { BC.setPaid(s.id, '2026-11', true); }); return { a: a, b: b }; }
  var wizText = 'Lan\nMinh\nHung\nThao\nQuang';

  /* ================= coach: first run ================= */
  test('first run: three choices, and nothing else to do', async function () {
    wipe(); var w = await frame('../admin.html');
    eq(qa(w, '[data-wz]').map(function (b) { return b.getAttribute('data-wz'); }), ['new', 'open', 'sample']);
    ok(!q(w, '.top'), 'no app chrome before a class exists');
  });
  test('wizard: later steps stay dimmed until the earlier ones are complete', async function () {
    wipe(); var w = await frame('../admin.html'); await click(w, '[data-wz="new"]');
    eq(qa(w, '.steps button').map(function (b) { return b.disabled; }), [false, false, true, true, true]);
    await click(w, '[data-wz="next"]');
    ok(q(w, '[data-wz="next"]').disabled, 'Next is dimmed with no names');
    ok(/Paste at least one name/.test(txt(w, '#wz-why')), 'reason is shown: ' + txt(w, '#wz-why'));
    ok(q(w, '[data-wz="go"][data-s="3"]').disabled, 'step 3 is locked');
    await type(w, '#wz-names', wizText); ok(!q(w, '[data-wz="next"]').disabled); ok(/5 students/.test(txt(w, '#wz-why')));
    ok(!q(w, '[data-wz="go"][data-s="3"]').disabled, 'step 3 opens');
  });
  test('wizard: the layout does not move when Next switches between dimmed and ready', async function () {
    wipe(); var w = await frame('../admin.html'); await click(w, '[data-wz="new"]'); await click(w, '[data-wz="next"]');
    var r = function (s) { var b = q(w, s).getBoundingClientRect(); return [b.top, b.left, b.width, b.height].join(); };
    var before = [r('#wz-bar'), r('[data-wz="next"]'), r('[data-wz="back"]'), r('.wz-h')];
    await type(w, '#wz-names', wizText);
    eq([r('#wz-bar'), r('[data-wz="next"]'), r('[data-wz="back"]'), r('.wz-h')], before);
  });
  test('wizard: numbers stop at their limits and the two fees cannot cross', async function () {
    wipe(); var w = await frame('../admin.html'); await click(w, '[data-wz="new"]');
    var outs = function () { return qa(w, '.stepper output').map(function (o) { return o.textContent.replace(/\D/g, ''); }).map(Number); };
    for (var i = 0; i < 90 && !q(w, '[data-k="fee2"][data-d="-1"]').disabled; i++) q(w, '[data-k="fee2"][data-d="-1"]').click();
    await sleep(60); var o = outs(); eq(o[2], o[1], 'the 2-day fee stops at the 1-day fee');
    ok(q(w, '[data-k="fee1"][data-d="1"]').disabled, 'the 1-day fee cannot go above it');
    for (i = 0; i < 20 && !q(w, '[data-k="courts"][data-d="1"]').disabled; i++) q(w, '[data-k="courts"][data-d="1"]').click();
    eq(outs()[0], BC.LIMITS.courts, 'courts stop at the limit');
  });
  test('wizard: the last class day cannot be switched off, and end times only follow the start', async function () {
    wipe(); var w = await frame('../admin.html'); await click(w, '[data-wz="new"]');
    var on = qa(w, '[data-wz="day"]').filter(function (b) { return b.getAttribute('aria-pressed') === 'true'; });
    for (var i = 0; i < on.length - 1; i++) { qa(w, '[data-wz="day"]').filter(function (b) { return b.getAttribute('aria-pressed') === 'true' && !b.disabled; })[0].click(); await sleep(60); }
    var last = qa(w, '[data-wz="day"]').filter(function (b) { return b.getAttribute('aria-pressed') === 'true'; });
    eq(last.length, 1); ok(last[0].disabled, 'the last day is dimmed');
    var d = last[0].getAttribute('data-d'); await type(w, '#wz-s-' + d, '21:30', 'change');
    ok([].slice.call(q(w, '#wz-e-' + d).options).every(function (o) { return o.text > q(w, '#wz-s-' + d).value; }), 'every end time is after the start');
  });
  test('wizard: every student needs a day before Next, and flexible students keep their chips dimmed', async function () {
    wipe(); var w = await frame('../admin.html'); await click(w, '[data-wz="new"]'); await click(w, '[data-wz="next"]');
    await type(w, '#wz-names', wizText); await click(w, '[data-wz="next"]');
    ok(q(w, '[data-wz="next"]').disabled); ok(/5 students still need a day/.test(txt(w, '#wz-why')), txt(w, '#wz-why'));
    await click(w, '[data-wz="allday"][data-d="2"]'); ok(!q(w, '[data-wz="next"]').disabled);
    await click(w, '[data-wz="type"][data-i="0"][data-v="flexible"]');
    ok(qa(w, '[data-wz="sday"][data-i="0"]').every(function (b) { return b.disabled; }), 'flexible chips dimmed');
  });
  test('wizard: Finish stays dimmed until the file is saved or skipped on purpose, then the class opens', async function () {
    wipe(); var w = await frame('../admin.html'); await click(w, '[data-wz="new"]'); await click(w, '[data-wz="next"]');
    await type(w, '#wz-names', wizText); await click(w, '[data-wz="next"]'); await click(w, '[data-wz="allday"][data-d="2"]');
    await click(w, '[data-wz="next"]'); await click(w, '[data-wz="paid"][data-i="0"]'); await click(w, '[data-wz="next"]');
    ok(q(w, '[data-wz="finish"]').disabled, 'Finish is dimmed'); ok(/Save the file first/.test(txt(w, '#wz-why')));
    await click(w, '[data-wz="later"]'); await click(w, '.dialog [data-v="1"]');
    ok(!q(w, '[data-wz="finish"]').disabled, 'skipping on purpose opens Finish');
    await click(w, '[data-wz="finish"]'); await sleep(200);
    ok(q(w, '.top'), 'the class opens'); eq(w.BC.students.length, 5); eq(txt(w, '.dchip'), 'Back up now');
  });
  test('wizard: back from step 1 returns to the start screen and nothing is saved', async function () {
    wipe(); var w = await frame('../admin.html'); await click(w, '[data-wz="new"]'); await click(w, '[data-wz="back"]');
    ok(q(w, '[data-wz="new"]')); ok(!localStorage.getItem('bc_data'));
  });

  /* ================= coach: add student, settings, data ================= */
  test('add student: Save stays dimmed with a reason for each mistake, in the order she would fix them', async function () {
    wipe(); saveClass(two); var w = await frame('../admin.html'); await click(w, '[data-tab="students"]'); await click(w, '[data-a="addstu"]'); await sleep(200);
    ok(q(w, '#as-save').disabled && /Type a name first/.test(txt(w, '#as-why')));
    ok(qa(w, '#f-days .chip').every(function (b) { return b.disabled; }), 'days wait for a name');
    await type(w, '#f-name', 'jane'); ok(/already in the class/.test(txt(w, '#as-why')), 'repeat name, ignoring capitals');
    await type(w, '#f-name', 'Hoa'); ok(/at least one day/.test(txt(w, '#as-why'))); ok(qa(w, '#f-days .chip').every(function (b) { return !b.disabled; }));
    await click(w, '#f-days .chip'); ok(!q(w, '#as-save').disabled && /Ready/.test(txt(w, '#as-why')));
    await type(w, '#f-start', '2030-01-01'); ok(q(w, '#as-save').disabled && /within a year/.test(txt(w, '#as-why')));
    eq(q(w, '#f-name').maxLength, BC.LIMITS.nameLen);
  });
  test('add student: the first bill preview has room reserved, so Save does not jump', async function () {
    wipe(); saveClass(two); var w = await frame('../admin.html'); await click(w, '[data-tab="students"]'); await click(w, '[data-a="addstu"]'); await sleep(200);
    var top = function () { return q(w, '#as-save').getBoundingClientRect().top; }, t0 = top();
    await type(w, '#f-name', 'Hoa'); await click(w, '#f-days .chip'); eq(top(), t0);
  });
  test('settings: a fee is clamped, the two fees never cross, the Zalo number keeps only digits', async function () {
    wipe(); saveClass(two); var w = await frame('../admin.html'); await click(w, '[data-tab="more"]'); await click(w, '[data-a="sub"][data-x="settings"]'); await sleep(150);
    await type(w, '[data-k="fee_1day"]', '9999999', 'change'); eq(w.BC.config.fee_1day, w.BC.config.fee_2days, 'cannot go above the 2-day fee');
    await type(w, '[data-k="fee_2days"]', '1000', 'change'); ok(w.BC.config.fee_2days >= w.BC.config.fee_1day);
    await type(w, '[data-k="coach_zalo"]', '09ab12-34 5', 'change'); eq(w.BC.config.coach_zalo, '0912345');
  });
  test('timetable: adding Monday starts today and the rest of the app follows', async function () {
    wipe(); saveClass(function () { var o = two(); [0, 1, 3, 5, 6].forEach(function (d) { BC.timetable[d].on = false; }); return o; });
    var w = await frame('../admin.html'); await click(w, '[data-tab="more"]'); await click(w, '[data-a="sub"][data-x="timetable"]'); await sleep(150);
    await click(w, '[data-a="ttsw"][data-x="1"]'); await sleep(200);
    ok(w.BC.classDay('2026-11-09') && !w.BC.classDay('2026-11-02'), 'Monday starts today, not before');
    ok(/starts today/i.test(txt(w, '#toast-root')), 'she is told: ' + txt(w, '#toast-root'));
    ok(/stay as they were/.test(txt(w, '#view')), 'the page says nothing earlier changes');
  });
  test('timetable: switching a day off asks first and says who is affected; the last day stays on', async function () {
    wipe(); saveClass(function () { var o = two(); [0, 1, 3, 5, 6].forEach(function (d) { BC.timetable[d].on = false; }); return o; });
    var w = await frame('../admin.html'); await click(w, '[data-tab="more"]'); await click(w, '[data-a="sub"][data-x="timetable"]'); await sleep(150);
    await click(w, '[data-a="ttsw"][data-x="4"]'); ok(/1 students have this as a regular day/.test(txt(w, '.dialog')), txt(w, '.dialog'));
    await click(w, '.dialog [data-v="0"]'); ok(w.BC.classDay('2026-11-12'), 'keeping it changes nothing');
    await click(w, '[data-a="ttsw"][data-x="4"]'); await click(w, '.dialog [data-v="1"]'); ok(!w.BC.classDay('2026-11-12'));
    ok(q(w, '[data-a="ttsw"][data-x="2"]').disabled, 'the last day is dimmed');
  });
  test('my data: the chip and Start over follow whether the work is in a file', async function () {
    wipe(); saveClass(two); var w = await frame('../admin.html');
    eq(txt(w, '.dchip'), 'Backed up'); await click(w, '[data-tab="payments"]'); await click(w, '[data-a="undopaid"]');
    eq(txt(w, '.dchip'), 'Back up now'); await click(w, '.dchip'); ok(q(w, '[data-a="startover"]').disabled, 'Start over is dimmed'); ok(/Save a file first/.test(txt(w, '#view')));
    await click(w, '[data-a="savefile"]'); await sleep(250); eq(txt(w, '.dchip'), 'Backed up'); ok(!q(w, '[data-a="startover"]').disabled);
  });
  test('my data: a saved copy that was edited by hand is explained on the start screen', async function () {
    wipe(); saveClass(two); var f = JSON.parse(localStorage.getItem('bc_data')); f.data.students[0].name = 'X'; localStorage.setItem('bc_data', JSON.stringify(f));
    var w = await frame('../admin.html'); ok(q(w, '.start') && txt(w, '.why[role=alert]').length > 10, txt(w, '.start'));
  });
  test('a sample class opens with a banner, and no backup nag', async function () {
    wipe(); var w = await frame('../admin.html'); await click(w, '[data-wz="sample"]'); await sleep(200);
    ok(q(w, '.sample-bar')); eq(txt(w, '.dchip'), 'Sample'); ok(!/cards to send/.test(txt(w, '#view')), 'no card nag in the sample');
  });

  /* ================= coach: cards ================= */
  test('send card: the coach sees which cards are missing or out of date, and copying one clears it', async function () {
    wipe(); saveClass(two); var w = await frame('../admin.html'); await click(w, '[data-tab="students"]');
    ok(/2 cards to send/.test(txt(w, '#view')), txt(w, '#view'));
    await click(w, '[data-a="cards"]'); await sleep(150); eq(qa(w, '.sheet [data-cc]').length, 2);
    await click(w, '.sheet [data-cc]'); await sleep(900);
    ok(/1 card to send/.test(txt(w, '.sheet')), txt(w, '.sheet'));
    qa(w, '.sheet [data-cc]').filter(function (b) { return /Copy message/.test(b.textContent); }).forEach(function (b) { b.click(); }); await sleep(900);
    ok(/All cards are up to date/.test(txt(w, '.sheet'))); await click(w, '.sheet [data-close]'); await sleep(250);
    ok(!/cards? to send/.test(txt(w, '#view')), 'the banner is gone');
  });
  test('send card: the rows keep their place while cards are marked as sent', async function () {
    wipe(); saveClass(two); var w = await frame('../admin.html'); await click(w, '[data-tab="students"]'); await click(w, '[data-a="cards"]'); await sleep(200);
    var names = function () { return qa(w, '.sheet .hist b').map(function (b) { return b.textContent; }); }, before = names();
    await click(w, '.sheet [data-cc]'); await sleep(900); eq(names(), before);
  });
  test('send card: a change makes that one student\'s card out of date again, and the sheet says so', async function () {
    wipe(); var o = saveClass(two); BC.markCardSent(o.a.id); BC.markCardSent(o.b.id); BC.autosave();
    var w = await frame('../admin.html'); await click(w, '[data-tab="students"]'); ok(!/cards? to send/.test(txt(w, '#view')));
    w.BC.skip(o.a.id, '2026-11-17'); await click(w, '[data-tab="sessions"]'); await click(w, '[data-tab="students"]');
    ok(/1 card to send/.test(txt(w, '#view')), txt(w, '#view'));
    var john = qa(w, '[data-a="stu"]').filter(function (b) { return /John/.test(b.textContent); })[0]; await click(w, john); await click(w, '#st-card'); await sleep(900);
    ok(/Something changed since/.test(txt(w, '.sheet')), txt(w, '.sheet'));
  });
  test('send card: "see it as the student sees it" link carries only that student', async function () {
    wipe(); var o = saveClass(two); var link = await BC.cardLink(o.b.id, location.origin + '/mockups/student.html');
    var s = await frame(link.replace(location.origin + '/mockups/', '../')); ok(/Hi, Jane|Xin chào, Jane/.test(txt(s, '.hdr')), txt(s, '.hdr'));
    ok(!/John/.test(s.document.body.innerHTML), 'no other student on the page');
  });

  /* ================= student card ================= */
  async function cardPage(sid, today) { var keep = BC.today; if (today) BC.today = today; var l = await BC.cardLink(sid, 'x'); BC.today = keep; return '../student.html' + l.slice(l.indexOf('#')); }
  test('card: there is no Key button and no counters, only the calendar', async function () {
    wipe(); var o = saveClass(two); var w = await frame(await cardPage(o.a.id));
    ok(!q(w, '[data-legend]') && !/\bKey\b|Chú thích/.test(txt(w, '.card')), 'no Key'); ok(!q(w, '.kpis') && !/Make-ups left|Credits to use|Học bù còn lại/.test(txt(w, '#app')), 'no counters');
    ok(q(w, '.cal-grid'));
  });
  test('card: with no credit, a day that is not theirs says so and offers an extra lesson, not a make-up', async function () {
    wipe(); var o = saveClass(two); var w = await frame(await cardPage(o.b.id)); await click(w, '.langbtn[data-lang="en"], [data-lang="en"]');
    await click(w, '[data-nav="1"]'); await click(w, '[data-iso="2026-12-10"]'); await sleep(250);
    var t = txt(w, '.sheet'); ok(/no make-up credit/i.test(t) && /extra lesson/i.test(t) && !/make-up here/i.test(t), t);
  });
  test('card: with a credit, the same day offers a make-up and says nothing about rules', async function () {
    wipe(); var o = saveClass(function () { var x = two(); BC.skip(x.b.id, '2026-11-17'); return x; }); var w = await frame(await cardPage(o.b.id));
    await click(w, '[data-lang="en"]'); await click(w, '[data-iso="2026-11-14"]'); await sleep(250);
    var t = txt(w, '.sheet'); ok(/make-up here/i.test(t) && !/no make-up credit/i.test(t), t);
  });
  test('card: a card shows the day and time it was made', async function () {
    wipe(); var o = saveClass(two); var w = await frame(await cardPage(o.a.id)); await click(w, '[data-lang="en"]');
    ok(/Card as of .*5 Nov, \d\d:\d\d/.test(txt(w, '.asof')), txt(w, '.asof'));
  });
  test('card: an old card says how old it is', async function () {
    wipe(); var o = saveClass(two); var w = await frame(await cardPage(o.a.id, '2026-10-20')); await click(w, '[data-lang="en"]');
    ok(/16 days old/.test(txt(w, '.banner')), txt(w, '#app'));
  });
  test('two cards: opening an OLD link after a newer one keeps the newer card and tells the student', async function () {
    wipe(); var o = saveClass(two); var oldL = await cardPage(o.a.id); BC.skip(o.a.id, '2026-11-17'); var newL = await cardPage(o.a.id);
    var w = await frame(newL); var asof = txt(w, '.asof'); var kept = localStorage.getItem('bc_card');
    ok(kept && newL.endsWith(kept), 'the new card is remembered');
    w = await frame(oldL); await click(w, '[data-lang="en"]');
    eq(localStorage.getItem('bc_card'), kept, 'the newer card is still the one kept');
    ok(/older card/i.test(txt(w, '.banner')), 'she is told: ' + txt(w, '#app')); eq(q(w, '[data-iso="2026-11-17"]').className.indexOf('skipped') >= 0, true, 'the newer card is the one drawn');
    ok(asof.length > 5);
  });
  test('two cards: opening the newer link after an older one replaces it', async function () {
    wipe(); var o = saveClass(two); var oldL = await cardPage(o.a.id); BC.skip(o.a.id, '2026-11-17'); var newL = await cardPage(o.a.id);
    await frame(oldL); var w = await frame(newL); ok(newL.endsWith(localStorage.getItem('bc_card'))); ok(q(w, '[data-iso="2026-11-17"]').className.indexOf('skipped') >= 0);
  });
  test('two cards: reopening the bare address shows the newest card', async function () {
    wipe(); var o = saveClass(two); var oldL = await cardPage(o.a.id); BC.skip(o.a.id, '2026-11-17'); var newL = await cardPage(o.a.id);
    await frame(newL); await frame(oldL); var kept = localStorage.getItem('bc_card'); var w = await frame('../student.html');
    ok(q(w, '[data-iso="2026-11-17"]').className.indexOf('skipped') >= 0, 'bare address should show the newest card; class=' + q(w, '[data-iso="2026-11-17"]').className + ' keptIsNew=' + newL.endsWith(kept) + ' keptIsOld=' + oldL.endsWith(kept) + ' now=' + newL.endsWith(localStorage.getItem('bc_card')));
  });
  test('card: a cut-short link says so instead of showing nothing', async function () {
    wipe(); var o = saveClass(two); var l = await cardPage(o.a.id); var w = await frame(l.slice(0, 40)); ok(/did not open|Không mở được/.test(txt(w, '#app')), txt(w, '#app'));
  });
  test('card: tapping a day never changes anything; it can only write a message', async function () {
    wipe(); var o = saveClass(two); var w = await frame(await cardPage(o.a.id)); var before = JSON.stringify(w.BC.changes);
    await click(w, '[data-lang="en"]'); await click(w, '[data-iso="2026-11-17"]'); await click(w, '[data-ask]'); await sleep(150);
    eq(JSON.stringify(w.BC.changes), before); ok(/John \(VM031\)/.test(txt(w, '.msgbox')), txt(w, '.msgbox'));
  });

  /* ================= every screen: big fingers ================= */
  function sizes(w) {
    var bad = [], visible = function (e) { var r = e.getBoundingClientRect(); return r.width > 0 && r.height > 0 && getComputedStyle(e).visibility !== 'hidden'; };
    qa(w, 'button, select.inp, input.inp, textarea.inp').filter(visible).forEach(function (e) {
      var h = e.getBoundingClientRect().height, name = (e.className || e.tagName) + ':' + (e.textContent || e.id || '').trim().slice(0, 14);
      if (e.closest('.mock-panel, .mock-fab') || e.classList.contains('cd')) return;
      var min = e.classList.contains('sm') || e.classList.contains('amt-edit') || e.closest('.seg') ? 39 : 47;
      if (e.classList.contains('chip')) min = 43; if (e.classList.contains('themebtn') || e.closest('.sheet-h')) min = 39;

      if (h < min) bad.push(name + ' ' + h.toFixed(0));
    });

  }
